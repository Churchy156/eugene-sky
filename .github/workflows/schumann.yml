name: Schumann live capture (Tomsk sos70 charts)
on:
  schedule:
    - cron: '41 */6 * * *'   # every 6 h; each chart spans ~3 days so captures overlap
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schumann-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - run: pip install numpy pandas pillow
      - name: Fetch + digitize current charts
        run: python schumann/capture_tomsk_live.py
      - name: Commit
        run: |
          git config user.name "eugene-sky-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/schumann_tomsk_live.csv
          git diff --cached --quiet && exit 0
          git commit -m "schumann live capture $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
