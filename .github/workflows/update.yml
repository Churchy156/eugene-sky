name: Update data & deploy site
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours at :17 UTC
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TZ: America/Los_Angeles
      TRIPCHECK_KEY: ${{ secrets.TRIPCHECK_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Incremental data update
        run: python update.py
      - name: New free sources (EPA AQS AQI, CDC wastewater/RESP-NET, FBI CDE crime, Treasury, CISA KEV)
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          MASTER: data/eugene_env_daily.csv.gz
          DICT: column_dictionary.csv
          AQS_FROM: '2025'
          RAWDIR: /tmp/rawnew
        run: timeout 600 python zip_tools/update_new.py || echo "new sources failed (non-fatal)"
      - name: Sports games within 100 mi (ESPN UO/OSU + MiLB refresh, merged into dataset)
        run: timeout 300 python zip_tools/build_sports.py || echo "sports refresh failed (non-fatal)"
      - name: Build dashboard
        run: python make_dash.py site/index.html
      - name: NASA DONKI + NeoWs, cyber feeds (merged into dataset)
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          python zip_tools/build_nasa.py || echo "nasa failed (non-fatal)"
          timeout 1500 python zip_tools/build_cyber.py || echo "cyber failed (non-fatal)"
          timeout 900 python zip_tools/build_ringfire.py || echo "ringfire/geonet failed (non-fatal)"
          python zip_tools/merge_daily.py || echo "merge failed (non-fatal)"
          python zip_tools/build_world.py || echo "world failed (non-fatal)"
      - name: Refresh game schedules (ESPN)
        run: python zip_tools/build_games.py || echo "games refresh failed (non-fatal)"
      - name: ZIP dashboard prebuilt JSON
        run: python build_zip.py || echo "zip prebuild failed (non-fatal)"
      - name: Daily outlook page
        run: python render_outlook.py || echo "outlook failed (non-fatal)"
      - name: Publish incident charts
        run: mkdir -p site/incidents && cp reports/incidents/* site/incidents/ || true
      - name: Commit updated dataset
        run: |
          git config user.name "eugene-sky-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/eugene_env_daily.csv.gz data/sports_games_100mi.csv reports/ zip_src/data/games.json zip_src/data/donki.json zip_src/data/cyber.json zip_src/data/cyber_pub.json data/donki_daily.json data/cyber_daily.json zip_src/data/world.json data/ringfire_daily.json zip_src/data/ringfire.json || true
          git diff --cached --quiet || git commit -m "data update $(date +'%Y-%m-%d %H:%M %Z')"
          git push || echo "push failed (non-fatal)"
      - name: Schumann page
        run: cp reports/schumann/schumann.html site/schumann.html || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
